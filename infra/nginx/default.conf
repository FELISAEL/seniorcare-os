# ==========================================================
#  SeniorCare OS - portal-web (Nginx)
#
#  Manejo de caché centralizado (una sola fuente de verdad):
#  - Cache-Control por TIPO de recurso mediante un $map,
#    no por página ni con ?v=... ni con service worker.
#  - ETag y Last-Modified se mantienen (los genera Nginx).
#  - Toda recarga normal revalida: el navegador pregunta y
#    recibe 304 si nada cambió, o 200 con el recurso nuevo
#    si cambió. No hace falta Ctrl+F5.
#  - Funciona sin Internet (todo local, dentro de la ISO).
# ==========================================================

# Tipo de recurso -> valor de Cache-Control.
# $uri no incluye query string, así que no depende de ?v=.
map $uri $sc_cache_control {
    # HTML y rutas SPA (todo lo que no sea estático conocido).
    default                                                            "no-cache, no-store, must-revalidate";

    # CSS y JavaScript.
    "~*\.(?:css|js|mjs)$"                                              "no-cache, must-revalidate";

    # Imágenes y fuentes locales.
    "~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|bmp|woff2?|ttf|otf|eot)$"  "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    # ETag activo (valor por defecto de Nginx; explícito aquí).
    etag on;

    # ------------------------------------------------------------
    #  Cabeceras comunes: se declaran SOLO a nivel server.
    #  Ningún location de recursos estáticos define add_header
    #  propio, por lo que todos heredan estas cabeceras sin
    #  duplicarlas (regla de herencia de add_header en Nginx).
    #  'always' -> también se emiten en respuestas 304.
    # ------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Cache-Control por tipo de recurso (mapa de arriba).
    add_header Cache-Control $sc_cache_control always;

    # ------------------------------------------------------------
    #  API: nunca se almacena.
    #  Cada bloque oculta el Cache-Control que pudiera venir del
    #  upstream y fuerza "no-store".
    # ------------------------------------------------------------
    location /api/identity/ {
        proxy_pass http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /api/care/ {
        proxy_pass http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /api/emergencies/ {
        proxy_pass http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /api/communication/ {
        proxy_pass http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /api/analytics/ {
        proxy_pass http://seniorcare-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------
    #  Service worker del panel autenticado (sin cambios).
    # ------------------------------------------------------------
    location ~ ^/panel/adulto-mayor/service-worker\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    #  Recursos estáticos + fallback SPA.
    #  Sin add_header propio: hereda las cabeceras del server
    #  (seguridad + Cache-Control por tipo de recurso).
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
