apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: seniorcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
        - name: identity-api
          image: seniorcare/identity-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__IdentityDatabase
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: IDENTITY_DB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: seniorcare-config
                  key: JWT_ISSUER
            - name: JWT_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: seniorcare-config
                  key: JWT_AUDIENCE
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: SEED_CAREGIVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: SEED_CAREGIVER_PASSWORD
            - name: SEED_RESIDENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: SEED_RESIDENT_PASSWORD
            - name: SEED_FAMILY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seniorcare-secrets
                  key: SEED_FAMILY_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: seniorcare
spec:
  selector:
    app: identity-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
